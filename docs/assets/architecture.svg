<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="320" fill="#ffffff"/>

  <!-- Browser -->
  <rect x="30" y="110" width="220" height="100" rx="12" fill="#eef4ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="140" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2a44">Navegador</text>
  <text x="140" y="172" text-anchor="middle" font-size="12" fill="#4a5a78">index.html + script.js</text>
  <text x="140" y="190" text-anchor="middle" font-size="12" fill="#4a5a78">(JS puro, sem framework)</text>

  <!-- Server -->
  <rect x="340" y="90" width="240" height="140" rx="12" fill="#eafff1" stroke="#2fa860" stroke-width="2"/>
  <text x="460" y="125" text-anchor="middle" font-size="16" font-weight="600" fill="#173d27">Servidor Node.js</text>
  <text x="460" y="148" text-anchor="middle" font-size="12" fill="#2f4e3a">server.js</text>
  <text x="460" y="168" text-anchor="middle" font-size="12" fill="#2f4e3a">roteamento manual por req.url</text>
  <text x="460" y="188" text-anchor="middle" font-size="12" fill="#2f4e3a">serve HTML / CSS / JS / JSON</text>
  <text x="460" y="208" text-anchor="middle" font-size="11" fill="#5a7466">(http.createServer, sem Express)</text>

  <!-- fields.json -->
  <rect x="650" y="115" width="210" height="90" rx="12" fill="#fff6e5" stroke="#d69a2d" stroke-width="2"/>
  <text x="755" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#4a3510">fields.json</text>
  <text x="755" y="172" text-anchor="middle" font-size="12" fill="#6b551f">fonte da verdade</text>
  <text x="755" y="190" text-anchor="middle" font-size="12" fill="#6b551f">request_fields + user_fields</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <line x1="250" y1="145" x2="335" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="292" y="135" text-anchor="middle" font-size="11" fill="#333">GET /</text>

  <line x1="335" y1="175" x2="250" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="292" y="200" text-anchor="middle" font-size="11" fill="#333">HTML/CSS/JS</text>

  <line x1="250" y1="220" x2="335" y2="220" stroke="#3b6fd6" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="292" y="240" text-anchor="middle" font-size="11" fill="#3b6fd6">fetch('/api/fields')</text>

  <line x1="580" y1="150" x2="645" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="612" y="140" text-anchor="middle" font-size="10" fill="#333">fs.readFileSync</text>

  <line x1="645" y1="180" x2="580" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="612" y="200" text-anchor="middle" font-size="10" fill="#333">conteúdo (texto)</text>

  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2a44">Arquitetura — Formulário Dinâmico</text>
</svg>
