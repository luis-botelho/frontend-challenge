<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="260" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2a44">Fluxo de renderização do formulário</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Step boxes -->
  <g font-size="12">
    <!-- 1 -->
    <rect x="20" y="70" width="150" height="90" rx="10" fill="#eef4ff" stroke="#3b6fd6" stroke-width="2"/>
    <text x="95" y="100" text-anchor="middle" font-weight="600" fill="#1f2a44">1. Página carrega</text>
    <text x="95" y="120" text-anchor="middle" fill="#4a5a78">script.js (módulo)</text>
    <text x="95" y="138" text-anchor="middle" fill="#4a5a78">executa</text>

    <!-- 2 -->
    <rect x="205" y="70" width="150" height="90" rx="10" fill="#eef4ff" stroke="#3b6fd6" stroke-width="2"/>
    <text x="280" y="100" text-anchor="middle" font-weight="600" fill="#1f2a44">2. fetch</text>
    <text x="280" y="120" text-anchor="middle" fill="#4a5a78">GET /api/fields</text>

    <!-- 3 -->
    <rect x="390" y="70" width="150" height="90" rx="10" fill="#eafff1" stroke="#2fa860" stroke-width="2"/>
    <text x="465" y="95" text-anchor="middle" font-weight="600" fill="#173d27">3. Servidor lê</text>
    <text x="465" y="113" text-anchor="middle" fill="#2f4e3a">fields.json e</text>
    <text x="465" y="131" text-anchor="middle" fill="#2f4e3a">responde JSON</text>

    <!-- 4 -->
    <rect x="575" y="70" width="150" height="90" rx="10" fill="#fff6e5" stroke="#d69a2d" stroke-width="2"/>
    <text x="650" y="95" text-anchor="middle" font-weight="600" fill="#4a3510">4. Loop nos</text>
    <text x="650" y="113" text-anchor="middle" fill="#6b551f">campos</text>
    <text x="650" y="131" text-anchor="middle" fill="#6b551f">(request+user)</text>

    <!-- 5 -->
    <rect x="760" y="70" width="215" height="90" rx="10" fill="#fdeaea" stroke="#d64545" stroke-width="2"/>
    <text x="867" y="95" text-anchor="middle" font-weight="600" fill="#4a1414">5. Cria elementos DOM</text>
    <text x="867" y="113" text-anchor="middle" fill="#6b2929">por tipo (select,</text>
    <text x="867" y="131" text-anchor="middle" fill="#6b2929">input, textarea)</text>
  </g>

  <!-- Arrows between steps -->
  <line x1="170" y1="115" x2="200" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="355" y1="115" x2="385" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="540" y1="115" x2="570" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="725" y1="115" x2="755" y2="115" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Step 6 below -->
  <rect x="390" y="190" width="220" height="55" rx="10" fill="#f1eaff" stroke="#7c4fd6" stroke-width="2"/>
  <text x="500" y="212" text-anchor="middle" font-weight="600" font-size="12" fill="#2e1d4a">6. replaceChildren(fragment)</text>
  <text x="500" y="230" text-anchor="middle" font-size="11" fill="#4a3a6b">(uma única escrita no DOM)</text>

  <path d="M867,160 C 867,200 610,200 615,205" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow2)"/>
</svg>
